<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="hoverDeutsch.css"/>
  </head>

<body>
  <div class="outer-wrapper">
    <div class="plugin-config">
        <p>Select how words are detected</p>
        <input type="radio" id="hover" name="detection" value="hover">
        <label for="hover">Hover</label><br>
        <input type="radio" id="click" name="detection" value="click">
        <label for="click">Click</label><br>

        <p>Select to show translations</p>
        <input type="checkbox" id="translations name="translations" value="translations">
        <label for="translations">Translations</label><br>


    </div>
    
    <div class="interface-config">
        <label for="bcolor">Select the tooltip background color</label>
        <input type="color" id="bcolor" name="bcolor" value="#ff0000">
        <p>Please select the tooltip font color</p>
        
        <p>Please select the tooltip font size</p>
    </div>
  </div>

  
</body>

</html>
